replicaCount: 2

image:
  repository: ghcr.io/crmagz/workbench
  # Development-only fallback. Production requires image.digest.
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

deployment:
  revisionHistoryLimit: 10
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  terminationGracePeriodSeconds: 35
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  topologySpreadConstraints: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Session mode is the only production mode. It proxies same-origin browser
# requests to an environment-owned OIDC session relay; no API credential is
# placed in the browser or this chart. Static mode exists solely for local Kind.
relay:
  mode: session
  session:
    upstreamUrl: ""
    # Must resolve to the same origin as upstreamUrl. Defaults to /healthz.
    readinessUrl: ""
  # Must exceed Cogito's 60-second planner request budget.
  upstreamTimeoutMs: 65000
  static:
    upstreamUrl: ""
    existingSecret: ""
    tokenKey: token

networkPolicy:
  enabled: false
  # Explicitly enumerate trusted ingress and required egress peers. In
  # production both lists are mandatory to avoid an accidental allow-all rule.
  ingress: []
  egress: []

tests:
  enabled: true
  image: curlimages/curl@sha256:4026b29997dc7c823b51c164b71e2b51e0fd95cce4601f78202c513d97da2922

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}

global:
  production: false
